<style>
:root{--ink:#292725;--muted:#7e7870;--line:#e5dfd6;--accent:#94785e;--page:#ffffff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif}button{font:inherit}
body{padding:32px 28px 56px}.shell{max-width:1440px;margin:auto}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding:8px 4px 22px;margin-bottom:24px}.brand{font-family:Georgia,"Times New Roman",serif;letter-spacing:.08em;font-size:clamp(24px,3vw,40px)}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.atelier{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr);gap:24px;align-items:start}
.stage-card{padding:0;position:sticky;top:12px;z-index:5}
.stage-head{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:0 2px 10px}.stage-head h1{font-family:Georgia,serif;font-size:24px;font-weight:400;margin:0}
.canvas-wrap{position:relative;border-radius:17px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.view{margin:0;padding:4% 5% 3%;display:grid;place-items:center}.view canvas{display:block;max-width:100%;max-height:min(68vh,720px);width:auto;height:auto}
.view figcaption{text-align:center;font-size:11px;color:var(--muted);margin-top:10px;letter-spacing:.04em}
.stage-loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(5px);color:var(--muted);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.stage-loading.show{opacity:1}
.stage-foot{display:flex;justify-content:flex-end;align-items:center;padding:8px 2px 0;gap:12px;color:var(--muted);font-size:11px}.stage-foot button{border:0;background:transparent;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.controls{display:grid;gap:14px}.control-card h2{font-family:Georgia,serif;font-size:20px;font-weight:400;margin:0 0 12px}
.part-grid{display:grid;grid-template-columns:1fr;gap:12px}
.part{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff}
.part-label,.metal-title{display:block;color:var(--ink);font-size:12px;font-weight:500;margin-bottom:6px}.metal-title{margin-bottom:8px}
.material-label{display:block;font-size:11px;color:var(--muted);margin-top:12px;letter-spacing:.04em}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}
.swatch{min-width:0;border:none;border-radius:12px;aspect-ratio:1/1;padding:0;position:relative;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65),0 2px 6px rgba(0,0,0,.16);transition:transform .15s ease,box-shadow .15s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 6px 12px rgba(0,0,0,.18)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink),0 2px 6px rgba(0,0,0,.16)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:5px;border:2px solid rgba(255,255,255,.95);border-radius:9px}
.control-row{display:flex;gap:10px;flex-wrap:wrap}
.toggle{flex:1;min-width:88px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;text-align:center;cursor:pointer;color:var(--muted);transition:all .16s}.toggle strong{display:block;color:var(--ink);font-size:12px;font-weight:500}
.toggle small{display:block;font-size:10px;margin-top:2px;color:var(--muted)}
.toggle[aria-pressed="true"]{border-color:var(--accent);background:#f5eee6;color:var(--accent);box-shadow:0 8px 18px rgba(148,120,94,.1)}
.product-row .product-col{flex:1;min-width:120px;display:flex;flex-direction:column;align-items:center;gap:8px}.product-row .product-col .toggle{width:100%;min-width:0}
.product-row .official-link{margin:0;font-size:11px;line-height:1.6;text-align:center}.product-row .official-link span{display:inline-block;text-decoration:underline;text-underline-offset:3px}
.metal-box{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff;margin-top:12px}
.metal-box[hidden],.part[hidden]{display:none}
.toggle .nb{display:block}
.toggle .pl{display:inline}
@media(max-width:640px){.product-row .toggle .pl{display:block}.product-row .toggle strong.sm{font-size:11px}}
.handle-inset{position:absolute;left:0;top:0;width:200px;margin:0;padding:8px 8px 6px;background:rgba(255,255,255,.92);border:solid var(--line);border-width:0 1px 1px 0;border-radius:16px 0 12px 0;z-index:2}.handle-inset[hidden]{display:none}.handle-inset canvas{display:block;width:100%;height:auto}.handle-inset figcaption{text-align:center;font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
.summary{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff;margin-top:12px}.summary-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.note{font-size:11px;line-height:1.7;color:var(--muted);margin:10px 0 0}.summary p{font-size:12px;line-height:1.8;margin:0;color:var(--muted)}.summary b{color:var(--ink);font-weight:500;font-size:12px}
.copy{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;cursor:pointer;color:var(--accent);white-space:nowrap}
:root{--display-font:Cinzel,"Trajan Pro","Cormorant Garamond",Georgia,serif}
.brand{font-family:var(--display-font);font-weight:400;letter-spacing:.06em;font-size:clamp(20px,3.4vw,40px);line-height:1.15;color:#111;text-transform:uppercase}
.brand .amp{letter-spacing:.08em}.brand .dot{margin-left:.02em}
.stage-head h1,.control-card h2{font-family:var(--display-font);letter-spacing:.05em;color:#111}

.note{white-space:pre-line}.note[hidden]{display:none}
@media(max-width:980px){body{padding:18px 14px 36px}.atelier{grid-template-columns:1fr}.stage-card{top:0;background:var(--page);padding-top:8px;margin:0 -14px;padding-left:14px;padding-right:14px;padding-bottom:8px;box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}.view canvas{max-height:38vh}}

 document.getElementById("summaryNote").textContent="※コピーはメモとしてお使いください。"+(blackStitch||hook||chain||crocHandle?"\n※オプションは個別でカートにお入れください。":"");
}
const COPY_BUTTON_IDS=["copySummary","copySummaryTop"],copyLabels={};
function resetCopyButtons(){for(const id of COPY_BUTTON_IDS){const b=document.getElementById(id);if(!(id in copyLabels))copyLabels[id]=b.textContent;b.textContent=copyLabels[id];}}
function setCopyButtons(label){resetCopyButtons();for(const id of COPY_BUTTON_IDS)document.getElementById(id).textContent=label;}
let copiedText=null;
function syncCopyButtons(){if(summaryLines().join("\n")!==copiedText){copiedText=null;resetCopyButtons();}}
async function copySummary(){const text=summaryLines().join("\n");let label="コピーしました";try{await navigator.clipboard.writeText(text);}catch(e){label="コピーできませんでした";}if(text!==summaryLines().join("\n"))return;copiedText=text;setCopyButtons(label);}
function setupUI(){
 toggleButtons("productControls",PRODUCTS.map(p=>({value:p.key,label:p.label,url:p.url,lines:p.lines,small:p.small})),()=>state.product,v=>{state.product=v;buildSwatches();});
 toggleButtons("handleControls",HANDLE_OPTIONS,()=>cur().handle,v=>{cur().handle=v;});
 toggleButtons("metalControls",METALS,()=>cur().metal,v=>{cur().metal=v;});
 toggleButtons("stitchControls",STITCHES,()=>cur().stitch,v=>{cur().stitch=v;});
 toggleButtons("hookControls",HOOK_OPTIONS,()=>cur().hook,v=>{cur().hook=v;});
 toggleButtons("chainControls",CHAIN_OPTIONS,()=>cur().chain,v=>{cur().chain=v;});
 buildSwatches();
 document.getElementById("copySummary").addEventListener("click",copySummary);
 document.getElementById("copySummaryTop").addEventListener("click",copySummary);
 updateControls();
}
async function boot(){
 setupUI();
 try{await Promise.all([loadRings(),loadCroc(),...Object.keys(VIEWS).map(prepare)]);render();document.getElementById("loading").classList.remove("show");document.body.dataset.ready="1";}
 catch(e){document.getElementById("loading").textContent="読み込みエラー: "+e.message;document.body.dataset.ready="error";}
}
boot();
</script>
</body>
