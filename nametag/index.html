.swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:5px;border:2px solid rgba(255,255,255,.95);border-radius:9px}
.control-row{display:flex;gap:10px;flex-wrap:wrap}
.toggle{flex:1;min-width:88px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;text-align:center;cursor:pointer;color:var(--muted);transition:all .16s}.toggle strong{display:block;color:var(--ink);font-size:12px;font-weight:500}
.toggle[aria-pressed="true"]{border-color:var(--accent);background:#f5eee6;color:var(--accent);box-shadow:0 8px 18px rgba(148,120,94,.1)}

.product-row .official-link{margin:0;font-size:11px;line-height:1.6;text-align:center}.product-row .official-link span{display:inline-block;text-decoration:underline;text-underline-offset:3px}
.metal-box{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff;margin-top:12px}
.metal-box[hidden],.part[hidden]{display:none}
.toggle .pl{display:inline}
@media(max-width:640px){.product-row .toggle .pl{display:block}.product-row .toggle strong.sm{font-size:11px}}
.engrave-row{display:flex;align-items:center;gap:10px}.engrave-row[hidden]{display:none}
.engrave-input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-family:"Times New Roman",Tinos,serif;font-size:20px;letter-spacing:.04em;color:var(--ink);background:#fff;outline:none}

.engrave-input::placeholder{color:#c4bdb3;font-family:"Hiragino Sans","Yu Gothic",sans-serif;font-size:13px;letter-spacing:0}

.note.engrave-error{color:var(--error)}
.engrave-rule{margin-top:12px}
.summary{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff;margin-top:12px}.summary-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

:root{--display-font:Cinzel,"Trajan Pro","Cormorant Garamond",Georgia,serif}

let copiedText=null;
function syncCopyButtons(){if(summaryLines().join("\n")!==copiedText){copiedText=null;resetCopyButtons();}}
async function copySummary(){const text=summaryLines().join("\n");let label="コピーしました";try{await navigator.clipboard.writeText(text);}catch(e){label="コピーできませんでした";}if(text!==summaryLines().join("\n"))return;copiedText=text;setCopyButtons(label);}
function setupUI(){
 toggleButtons("productControls",PRODUCTS.map(p=>({value:p.key,label:p.label,url:p.url,lines:p.lines,small:p.small})),()=>state.product,v=>{state.product=v;document.getElementById("engraveInput").value=cur().text;});
 toggleButtons("stitchControls",STITCHES,()=>cur().stitch,v=>{cur().stitch=v;});
 toggleButtons("engraveTypeControls",ENGRAVE_TYPES,()=>cur().engraveType,v=>{cur().engraveType=v;});
 toggleButtons("textColorControls",TEXT_COLORS,()=>cur().textColor,v=>{cur().textColor=v;});
 toggleButtons("ringControls",RING_OPTIONS,()=>cur().ring,v=>{cur().ring=v;});
 buildSwatches();
 const input=document.getElementById("engraveInput");input.addEventListener("input",onEngraveInput);input.addEventListener("compositionend",onEngraveInput);
 document.getElementById("copySummary").addEventListener("click",copySummary);
 document.getElementById("copySummaryTop").addEventListener("click",copySummary);
 updateControls();
}
async function boot(){
 setupUI();
 try{
  await Promise.all([document.fonts.load('40px "Times New Roman"','A').catch(()=>{}),document.fonts.load("40px Tinos","A").catch(()=>{})]);
  await Promise.all([loadRings(),loadSymbols(),...Object.keys(VIEWS).map(prepare)]);render();document.getElementById("loading").classList.remove("show");document.body.dataset.ready="1";}
 catch(e){document.getElementById("loading").textContent="読み込みエラー: "+e.message;document.body.dataset.ready="error";}
}
boot();
</script>
</body>
</html>
