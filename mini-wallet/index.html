<style>

<script>
"use strict";
const COLORS=[{"key": "black", "label": "ブラック", "hex": "#262522"}, {"key": "brick", "label": "ブリック", "hex": "#712926"}, {"key": "brown", "label": "ブラウン", "hex": "#ab6b58"}, {"key": "charcoal-gray", "label": "チャコールグレー", "hex": "#444345"}, {"key": "ciel-blue", "label": "シエルブルー", "hex": "#56aac8"}, {"key": "coral-pink", "label": "コーラルピンク", "hex": "#ff8870"}, {"key": "etoupe", "label": "エトープ", "hex": "#765a43"}, {"key": "gold", "label": "ゴールド", "hex": "#a65c2b"}, {"key": "greige", "label": "グレージュ", "hex": "#5c4c44"}, {"key": "ice-gray", "label": "アイスグレー", "hex": "#a5a5a5"}, {"key": "ivory", "label": "アイボリー", "hex": "#f3e9d3"}, {"key": "light-blue", "label": "ライトブルー", "hex": "#83e8e2"}, {"key": "lime-yellow", "label": "ライムイエロー", "hex": "#e5dc22"}, {"key": "mist-blue", "label": "ミストブルー", "hex": "#5e95a4"}, {"key": "navy", "label": "ネイビー", "hex": "#003d55"}, {"key": "orange", "label": "オレンジ", "hex": "#e98526"}, {"key": "pale-pink", "label": "ペールピンク", "hex": "#ffcae8"}, {"key": "pale-yellow", "label": "ペールイエロー", "hex": "#fcf1a4"}, {"key": "pink", "label": "ピンク", "hex": "#ff5979"}, {"key": "pistachio", "label": "ピスタチオ", "hex": "#a7b98a"}, {"key": "purple", "label": "パープル", "hex": "#752472"}, {"key": "red", "label": "レッド", "hex": "#a20028"}, {"key": "royal-blue", "label": "ロイヤルブルー", "hex": "#0040c2"}];
const VIEWS={"closed": {"base": "assets/closed.base.png?v=cd4f6184de", "masks": "assets/closed.masks.png?v=a2b3013845", "w": 933, "h": 608, "pxPerMm": 8, "sizeMm": {"w": 116.62, "h": 76.0}, "wallet": {"x": 6, "y": 6, "w": 920, "h": 595}, "parts": {"lid": null, "body": {"baseLum": 0.85172, "pixels": 509540, "baseL": 86.799, "kd": 79.17, "ku": 76.4}, "metal": null}}, "open": {"base": "assets/open.base.png?v=40bea4b2d9", "masks": "assets/open.masks.png?v=87b8a5edd1", "w": 932, "h": 614, "pxPerMm": 8, "sizeMm": {"w": 116.5, "h": 76.75}, "wallet": {"x": 6, "y": 6, "w": 920, "h": 601}, "parts": {"lid": {"baseLum": 0.727449, "pixels": 219157, "baseL": 78.125, "kd": 64.3, "ku": 61.94}, "body": {"baseLum": 0.479803, "pixels": 239353, "baseL": 57.738, "kd": 55.86, "ku": 40.51}, "metal": {"baseLum": 0.408403, "pixels": 6951}}}};
const DEFAULTS={lid:"charcoal-gray",body:"ivory",metal:"silver"};
const GRAIN_SCALE_MIN=.4;
const state={lid:DEFAULTS.lid,body:DEFAULTS.body,metal:DEFAULTS.metal};
const colorByKey=Object.fromEntries(COLORS.map(c=>[c.key,c]));
function clamp(v){return Math.max(0,Math.min(255,v));}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return {r:n>>16&255,g:n>>8&255,b:n&255};}
function srgbToLinear(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}
function linearToSrgb(v){return v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055;}
function rgbToLab(rgb){const r=srgbToLinear(rgb.r),g=srgbToLinear(rgb.g),b=srgbToLinear(rgb.b);const x=(r*.4124564+g*.3575761+b*.1804375)/.95047,y=(r*.2126729+g*.7151522+b*.072175)/1,z=(r*.0193339+g*.119192+b*.9503041)/1.08883;const f=v=>v>.008856?Math.cbrt(v):7.787*v+16/116;const fx=f(x),fy=f(y),fz=f(z);return {L:116*fy-16,a:500*(fx-fy),b:200*(fy-fz)};}
function labToRgbRaw(L,a,b){const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200;const finv=t=>{const t3=t*t*t;return t3>.008856?t3:(t-16/116)/7.787;};const x=finv(fx)*.95047,y=finv(fy),z=finv(fz)*1.08883;return {r:linearToSrgb(x*3.2404542+y*-1.5371385+z*-0.4985314)*255,g:linearToSrgb(x*-.969266+y*1.8760108+z*.041556)*255,b:linearToSrgb(x*.0556434+y*-.2040259+z*1.0572252)*255};}
const HIGHLIGHT_HEADROOM=.5;
function flatLeatherTone(lum,lab,baseLum,kd,ku){
 const ratio=Math.max(.35,Math.min(1.60,lum/Math.max(baseLum,.001)));
 let L;if(ratio<1)L=lab.L+(ratio-1)*kd;else{const d=(ratio-1)*ku,head=Math.max(.001,(100-lab.L)*HIGHLIGHT_HEADROOM);L=lab.L+head*(1-Math.exp(-d/head));}
 L=Math.max(0,Math.min(100,L));
 let rgb=labToRgbRaw(L,lab.a,lab.b);
 if([rgb.r,rgb.g,rgb.b].some(v=>v<0||v>255)){const C=Math.hypot(lab.a,lab.b),h=Math.atan2(lab.b,lab.a);let lo=0,hi=C;for(let i=0;i<20;i++){const mid=(lo+hi)/2,t=labToRgbRaw(L,Math.cos(h)*mid,Math.sin(h)*mid);if([t.r,t.g,t.b].every(v=>v>=0&&v<=255))lo=mid;else hi=mid;}rgb=labToRgbRaw(L,Math.cos(h)*lo,Math.sin(h)*lo);}
 return {r:Math.round(clamp(rgb.r)),g:Math.round(clamp(rgb.g)),b:Math.round(clamp(rgb.b))};
}
const METAL_GLOSS={k:2.1,pivot:.42,shade:.5,specFrom:.68,specSpan:.3,spec:.75};
const METAL_COLORS={silver:{hi:{r:243,g:246,b:252},sh:{r:109,g:118,b:130}},gold:{hi:{r:248,g:224,b:140},sh:{r:132,g:104,b:50}}};
function metalTone(lum,mode){const G=METAL_GLOSS,hi=METAL_COLORS[mode].hi,sh0=METAL_COLORS[mode].sh;
 let t=Math.max(0,Math.min(1,.5+(lum-G.pivot)*G.k));t=t*t*(3-2*t);
 let r=sh0.r*G.shade*(1-t)+hi.r*t,g=sh0.g*G.shade*(1-t)+hi.g*t,b=sh0.b*G.shade*(1-t)+hi.b*t;
 const sp=Math.pow(Math.max(0,Math.min(1,(lum-G.specFrom)/G.specSpan)),1.5)*G.spec;r=r*(1-sp)+255*sp;g=g*(1-sp)+255*sp;b=b*(1-sp)+255*sp;
 if(mode==="gold"){const gray=(r+g+b)/3,mute=.04;r=r*(1-mute)+gray*mute;g=g*(1-mute)+gray*mute;b=b*(1-mute)+gray*mute;}
 return {r:clamp(r),g:clamp(g),b:clamp(b)};}
const LUT_STEPS=1021,lutCache=new Map();
function leatherLut(hex,part){const key=hex+"|"+part.baseLum+"|"+part.kd+"|"+part.ku;if(lutCache.has(key))return lutCache.get(key);const lab=rgbToLab(hexToRgb(hex)),s=Math.max(GRAIN_SCALE_MIN,Math.min(1,lab.L/part.baseL)),t=new Uint8ClampedArray(LUT_STEPS*3);for(let i=0;i<LUT_STEPS;i++){const c=flatLeatherTone(i/1020,lab,part.baseLum,part.kd*s,part.ku*s);t[i*3]=c.r;t[i*3+1]=c.g;t[i*3+2]=c.b;}lutCache.set(key,t);return t;}
function metalLut(mode){const key="metal|"+mode;if(lutCache.has(key))return lutCache.get(key);const t=new Uint8ClampedArray(LUT_STEPS*3);for(let i=0;i<LUT_STEPS;i++){const c=metalTone(i/1020,mode);t[i*3]=c.r;t[i*3+1]=c.g;t[i*3+2]=c.b;}lutCache.set(key,t);return t;}
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("load failed: "+src));im.src=src;});}
function pixels(im){const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0);return x.getImageData(0,0,c.width,c.height);}
const prepared={};
async function prepare(name){
 const v=VIEWS[name],[bi,mi]=await Promise.all([loadImage(v.base),loadImage(v.masks)]);
 const base=pixels(bi),masks=pixels(mi),n=v.w*v.h,lumIdx=new Uint16Array(n),bd=base.data,md=masks.data;
 for(let p=0;p<n;p++){const i=p*4;lumIdx[p]=Math.round((.2126*bd[i]+.7152*bd[i+1]+.0722*bd[i+2])*4);}
 const canvas=document.getElementById("view-"+name);canvas.width=v.w;canvas.height=v.h;
 prepared[name]={v,base,masks,lumIdx,canvas,ctx:canvas.getContext("2d")};
}
function render(name){
 const P=prepared[name];if(!P)return;const {v,base,masks,lumIdx,ctx}=P,parts=v.parts;
 const lid=parts.lid?leatherLut(colorByKey[state.lid].hex,parts.lid):null,body=leatherLut(colorByKey[state.body].hex,parts.body),metal=metalLut(state.metal);
 const out=new ImageData(v.w,v.h),od=out.data,bd=base.data,md=masks.data;
 for(let p=0,i=0;p<lumIdx.length;p++,i+=4){const a=bd[i+3];if(a===0)continue;const l=lumIdx[p]*3,wl=lid?md[i]/255:0,wb=md[i+1]/255,wm=md[i+2]/255;
  od[i]=(wl&&lid[l]*wl)+body[l]*wb+metal[l]*wm;od[i+1]=(wl&&lid[l+1]*wl)+body[l+1]*wb+metal[l+1]*wm;od[i+2]=(wl&&lid[l+2]*wl)+body[l+2]*wb+metal[l+2]*wm;od[i+3]=a;}
 ctx.putImageData(out,0,0);
}
function renderAll(){for(const k of Object.keys(prepared))render(k);document.body.dataset.state=[state.lid,state.body,state.metal].join("/");}
const ITEM_MARK="◻︎";
function summaryLines(){return ["本体："+colorByKey[state.body].label,"フタ："+colorByKey[state.lid].label,"金具カラー："+(state.metal==="silver"?"シルバー":"ゴールド（オプション）")].map(s=>ITEM_MARK+s);}
function updateControls(){
 syncCopyButtons();
 for(const part of ["lid","body"])for(const b of document.querySelectorAll("#"+part+"Swatches .swatch"))b.setAttribute("aria-pressed",String(b.dataset.value===state[part]));
 for(const b of document.querySelectorAll("#metalControls .toggle"))b.setAttribute("aria-pressed",String(b.dataset.value===state.metal));
 const summaryHtml=s=>{const t=s.startsWith(ITEM_MARK)?s.slice(ITEM_MARK.length):s,i=t.indexOf("：")+1;return '<span class="item"><span class="hd"><span class="mk">'+ITEM_MARK+"</span>"+t.slice(0,i)+"</span>"+t.slice(i).split(" ").map(w=>w.split(/(?=（)/).map(x=>'<span class="w">'+x+"</span>").join("")).join(" ")+"</span>";};
 document.getElementById("summaryText").innerHTML="<b>選択中</b>"+summaryLines().map(summaryHtml).join("");
 document.getElementById("summaryNote").textContent="※コピーはメモとしてお使いください。"+(state.metal==="gold"?"\n※オプションは個別でカートにお入れください。":"");
 document.getElementById("metalNote").hidden=state.metal!=="gold";
}
const COPY_BUTTON_IDS=["copySummary","copySummaryTop"],copyLabels={};
function resetCopyButtons(){for(const id of COPY_BUTTON_IDS){const b=document.getElementById(id);if(!(id in copyLabels))copyLabels[id]=b.textContent;b.textContent=copyLabels[id];}}
function setCopyButtons(label){resetCopyButtons();for(const id of COPY_BUTTON_IDS)document.getElementById(id).textContent=label;}
let copiedText=null;
function syncCopyButtons(){if(summaryLines().join("\n")!==copiedText){copiedText=null;resetCopyButtons();}}
async function copySummary(){const text=summaryLines().join("\n");let label="コピーしました";try{await navigator.clipboard.writeText(text);}catch(e){label="コピーできませんでした";}if(text!==summaryLines().join("\n"))return;copiedText=text;setCopyButtons(label);}
function setupUI(){
 for(const part of ["lid","body"]){const box=document.getElementById(part+"Swatches");for(const c of COLORS){const b=document.createElement("button");b.type="button";b.className="swatch";b.dataset.value=c.key;b.style.background=c.hex;b.title=c.label;b.setAttribute("aria-label",c.label);b.addEventListener("click",()=>{state[part]=c.key;updateControls();renderAll();});box.appendChild(b);}}
 for(const b of document.querySelectorAll("#metalControls .toggle"))b.addEventListener("click",()=>{state.metal=b.dataset.value;updateControls();renderAll();});
 document.getElementById("copySummary").addEventListener("click",copySummary);
 document.getElementById("copySummaryTop").addEventListener("click",copySummary);
 updateControls();
}
async function boot(){
 setupUI();
 try{await Promise.all(Object.keys(VIEWS).map(prepare));renderAll();document.getElementById("loading").classList.remove("show");document.body.dataset.ready="1";}
 catch(e){document.getElementById("loading").textContent="読み込みエラー: "+e.message;document.body.dataset.ready="error";}
}
boot();
</script>
</body>
</html>
