 if(keys.length===2){const d0=dims[0],d1=dims[1],b0=CHARMS[d0.key].bboxPx,b1=CHARMS[d1.key].bboxPx,f0=CHARMS[d0.key].fgBboxPx,f1=CHARMS[d1.key].fgBboxPx;const rightEdge=W/2-bodyGap/2,leftEdge=W/2+bodyGap/2;const x0=rightEdge-d0.w,x1=leftEdge;placements[d0.side]={key:d0.key,x:x0-b0.x/CHARMS[d0.key].pxPerMm,y:groupTop+(maxH-d0.h)/2-f0.y/CHARMS[d0.key].pxPerMm,w:d0.w,h:d0.h,bounds:{x:x0,y:groupTop+(maxH-d0.h)/2,w:d0.w,h:d0.h}};placements[d1.side]={key:d1.key,x:x1-b1.x/CHARMS[d1.key].pxPerMm,y:groupTop+(maxH-d1.h)/2-f1.y/CHARMS[d1.key].pxPerMm,w:d1.w,h:d1.h,bounds:{x:x1,y:groupTop+(maxH-d1.h)/2,w:d1.w,h:d1.h}};}
 return {ring:{x:W/2-LAYOUT.ringOuterMm/2,y:ringCenterY-ringH/2,w:ringH,h:ringH},placements,keys,stage:{w:W,h:H},scale:stageN};
}
function drawRing(ctx,bitmap,ring){ctx.drawImage(bitmap,ring.x*LAYOUT.pxPerMmStage,ring.y*LAYOUT.pxPerMmStage,ring.w*LAYOUT.pxPerMmStage,ring.h*LAYOUT.pxPerMmStage);}
async function drawStage(job){if(!isCurrent(job))return false;const canvas=document.getElementById("stage"),ctx=canvas.getContext("2d");ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);const layout=computeLayout(job.left&&job.left.charmKey,job.right&&job.right.charmKey);if(job.metal!=="none"){const ring=await loadRing(job.metal);if(!isCurrent(job))return false;drawRing(ctx,ring,layout.ring);}for(const [sideIndex,b] of [job.left,job.right].entries()){if(!b)continue;const bitmap=await buildCharmBitmap(b);if(!isCurrent(job))return false;const p=layout.placements[sideIndex];if(!p)continue;ctx.drawImage(bitmap,p.x*LAYOUT.pxPerMmStage,p.y*LAYOUT.pxPerMmStage,bitmap.width*(LAYOUT.pxPerMmStage/CHARMS[b.charmKey].pxPerMm),bitmap.height*(LAYOUT.pxPerMmStage/CHARMS[b.charmKey].pxPerMm));}return true;}
async function requestRender(){const job=captureRenderJob(),loading=document.getElementById("loading");pinnedKeys=new Set([job.left,job.right].filter(Boolean).map(cacheKey));loading.classList.add("show");try{await drawStage(job);if(!isCurrent(job))return;runtimeStats.renderCount++;updateSummary();}catch(err){if(!isCurrent(job)){runtimeStats.staleJobErrors++;return;}console.error(err);const stage=document.getElementById("stage");stage.getContext("2d").clearRect(0,0,stage.width,stage.height);window.__copyLines=[];syncCopyButtons();document.getElementById("summaryText").innerHTML='<b>読み込みエラー</b> '+err.message;}finally{if(job.gen===renderGen)loading.classList.remove("show");}}
function sideVariants(side){return side.charm==="none"?[]:CALF_VARIANTS.filter(v=>v.appliesToCharms.includes(side.charm));}
function setSideCharm(which,key){state[which].charm=key;const vars=sideVariants(state[which]);if(!vars.some(v=>v.variantKey===state[which].variantKey))state[which].variantKey=vars[0]?.variantKey||"calf:ivory";renderSide(which);updateControls();requestRender();}
function renderSide(which){const side=state[which],select=document.getElementById(which+"Charm");select.value=side.charm;const lk=document.getElementById(which+"Link");if(lk){const u=OFFICIAL_LINKS[side.charm];lk.hidden=!u;if(u)lk.href=u;}const root=document.getElementById(which+"Swatches"),refocus=root.contains(document.activeElement);root.innerHTML="";const vars=sideVariants(side);if(!vars.length){root.innerHTML="";return;}for(const v of vars){const btn=document.createElement("button");btn.type="button";btn.className="swatch";btn.setAttribute("aria-pressed",String(v.variantKey===side.variantKey));btn.title=v.canonicalLabel+" "+v.approvedHex;btn.style.background=v.approvedHex;btn.setAttribute("aria-label",v.canonicalLabel);btn.addEventListener("click",()=>{state[which].variantKey=v.variantKey;renderSide(which);updateControls();requestRender();});root.appendChild(btn);if(refocus&&v.variantKey===side.variantKey)btn.focus();}}
function hasStitchCharm(keys=visibleKeys()){return keys.some(k=>CHARMS[k]&&supportsDisplayStitch(CHARMS[k]));}
function updateControls(){document.querySelectorAll(".toggle").forEach(btn=>{const g=btn.dataset.group,which=btn.dataset.side,current=which?state[which][g]:state[g];btn.setAttribute("aria-pressed",String(current===btn.dataset.value));if(which){const side=state[which],charm=CHARMS[side.charm];btn.disabled=side.charm==="none"||(g==="stitch"&&!supportsDisplayStitch(charm));}else btn.disabled=false;});updateSummary();}
function updateSummary(){const ITEM_MARK="◻︎",rows=[];let items=0,blackStitch=false;for(const which of ["left","right"]){const s=state[which],black=s.charm!=="none"&&supportsDisplayStitch(CHARMS[s.charm])&&s.stitch==="black";document.getElementById(which+"StitchNote").hidden=!black;blackStitch=blackStitch||black;if(s.charm==="none")continue;const c=CHARMS[s.charm],v=DISPLAY_VARIANTS.find(x=>x.variantKey===s.variantKey);rows.push({t:"アイテム："+c.label,gap:items>0});items++;rows.push({t:"カラー："+v.canonicalLabel});rows.push({t:"刻印："+(s.logo==="gold"?"ゴールド":"シルバー")});if(supportsDisplayStitch(c))rows.push({t:"ステッチ："+(s.stitch==="white"?"白":"黒（オプション）")});}if(!items)rows.push({t:"アイテム：なし"});const metal=state.metal==="none"?"":(state.metal==="silver"?"金具カラー：シルバー（オプション）":"金具カラー：ゴールド（オプション）");if(metal)rows.push({t:metal,gap:items>1});const itemHtml=r=>{const i=r.t.indexOf("：")+1;return '<span class="item'+(r.gap?" next":"")+'"><span class="hd"><span class="mk">'+ITEM_MARK+"</span>"+r.t.slice(0,i)+"</span>"+r.t.slice(i).split(" ").map(w=>w.split(/(?=（)/).map(x=>'<span class="w">'+x+"</span>").join("")).join(" ")+"</span>";};document.getElementById("summaryText").innerHTML="<b>選択中</b>"+rows.map(itemHtml).join("");window.__copyLines=rows.flatMap(r=>r.gap?["",ITEM_MARK+r.t]:[ITEM_MARK+r.t]);const sn=document.getElementById("summaryNote");if(sn)sn.textContent="※コピーはメモとしてお使いください。"+(state.metal!=="none"||blackStitch?"\n※オプションは個別でカートにお入れください。":"");const rn=document.getElementById("ringNote");if(rn)rn.textContent=state.metal==="none"?"※革紐が付属します":"※リングはオプションです";syncCopyButtons();}
function summaryPlain(){return (window.__copyLines||[]).join("\n");}
const COPY_BUTTON_IDS=["copySummary","copySummaryTop"],copyLabels={};
let copiedText=null;
function syncCopyButtons(){if(summaryPlain()!==copiedText){copiedText=null;resetCopyButtons();}}
function resetCopyButtons(){for(const id of COPY_BUTTON_IDS){const b=document.getElementById(id);if(!b)continue;if(!(id in copyLabels))copyLabels[id]=b.textContent;b.textContent=copyLabels[id];}}
function setCopyButtons(label){resetCopyButtons();for(const id of COPY_BUTTON_IDS){const b=document.getElementById(id);if(b)b.textContent=label;}}
async function copySummary(){const text=summaryPlain();try{await navigator.clipboard.writeText(text);if(text===summaryPlain()){copiedText=text;setCopyButtons("コピーしました");}}catch(e){if(text===summaryPlain())alert(text);}}
function setupUI(){for(const which of ["left","right"]){const select=document.getElementById(which+"Charm");select.innerHTML='<option value="none">なし</option>'+CHARM_KEYS.map(k=>'<option value="'+k+'">'+CHARMS[k].label+"</option>").join("");select.addEventListener("change",e=>setSideCharm(which,e.target.value));renderSide(which);}document.querySelectorAll(".toggle").forEach(btn=>btn.addEventListener("click",()=>{if(btn.disabled)return;const which=btn.dataset.side;if(which)state[which][btn.dataset.group]=btn.dataset.value;else state[btn.dataset.group]=btn.dataset.value;updateControls();requestRender();}));document.getElementById("copySummary").addEventListener("click",copySummary);document.getElementById("copySummaryTop").addEventListener("click",copySummary);updateControls();}
async function boot(){setupUI();await requestRender();}
window.addEventListener("beforeunload",()=>{bitmapCache.clear();for(const b of ringPromises.values())b.then(x=>x.close&&x.close()).catch(()=>{});});boot().catch(err=>{console.error(err);document.getElementById("summaryText").textContent="初期化エラー: "+err.message;});
})();
</script>
